name: Unstick Pages
on:
  push:
    paths:
      - '.github/workflows/unstick-pages.yml'
permissions:
  pages: write
  contents: read
jobs:
  unstick:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/pages/deployments/9ccc01e64d61844a983884e467df1a2cd6b8f542/cancel || echo "cancel failed (evtl. schon beendet)"
